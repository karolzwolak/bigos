[workspace]

[package]
name = "rustspace"
version = "0.1.0"
edition = "2024"

[lib]
name = "rustspace"
path = "src/lib.rs"

[[bin]]
name = "rust1st"
path = "src/bin/rust1st.rs"

[[bin]]
name = "wnd_app"
path = "src/bin/wnd_app.rs"

[[bin]]
name = "theophe"
path = "src/bin/theophe.rs"

[[bin]]
name = "memstrs"
path = "src/bin/memstrs.rs"

[[bin]]
name = "regprobe"
path = "src/bin/regprobe.rs"

[[bin]]
name = "spinner"
path = "src/bin/spinner.rs"

[[bin]]
name = "busyloop"
path = "src/bin/busyloop.rs"

[[bin]]
name = "yldloop"
path = "src/bin/yldloop.rs"

[[bin]]
name = "worker"
path = "src/bin/worker.rs"

[[bin]]
name = "sleeper"
path = "src/bin/sleeper.rs"

[[bin]]
name = "pingpong"
path = "src/bin/pingpong.rs"

[[bin]]
name = "fs_test"
path = "src/bin/fs_test.rs"

[[bin]]
name = "fsworker"
path = "src/bin/fsworker.rs"

[[bin]]
name = "fpustrs"
path = "src/bin/fpustrs.rs"

[[bin]]
name = "winstrs"
path = "src/bin/winstrs.rs"

[[bin]]
name = "spawner"
path = "src/bin/spawner.rs"

[[bin]]
name = "spawnee"
path = "src/bin/spawnee.rs"

[dependencies]
x86_64 = "0.15.2"
spin = "0.10.0"
embedded-graphics = "0.8.2"
bitflags = "2.11.0"
static_assertions = "1.1.0"

[[bin]]
name = "bigproc"
path = "src/bin/bigproc.rs"

[[bin]]
name = "treeroot"
path = "src/bin/treeroot.rs"

[[bin]]
name = "treeleaf"
path = "src/bin/treeleaf.rs"
