[package]
name = "kernel"
version.workspace = true
edition.workspace = true

[build-dependencies]
cc = "1.0"

[target.'cfg(target_arch = "x86_64")'.build-dependencies]
cc = "1.0"

[features]
default = ["use_cached_fs"]
use_cached_fs = []


[dependencies]
limine = "0.6.3"
uart_16550 = "0.5.0"
x86_64 = "0.15.2"
pc-keyboard = "0.8.0"
spin = "0.10.0"
embedded-graphics = "0.8.2"
acpi = "6.1.1"
linked_list_allocator = "0.9.0"
bitflags = "2.11.0"
elf = {version = "0.8.0", default-features = false }
bytemuck = "1.25.0"
micromath = "2.1.0"
static_assertions = "1.1.0"


[dependencies.lazy_static]
version = "1.5"
features = ["spin_no_std"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
