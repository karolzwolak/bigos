[alias]
xtask = "run --manifest-path xtask/Cargo.toml --"
x = "run --manifest-path xtask/Cargo.toml --"

[target.x86_64-unknown-none]
rustflags = [
    "-C", "link-arg=-Tlinker-x86_64.ld",
    "-C", "relocation-model=static",
]

# Note: build-std is passed explicitly by xtask via `cargo -Z build-std=core,alloc`
# To build kernel directly: cargo build -p kernel --target x86_64-unknown-none -Z build-std=core,alloc